  <style>
    :root{
      --bg:#05070a;
      --surface:#0b1017;
      --ink:#f5f7fb;
      --muted:#9aa3ad;
      --accent:#33d4ff;
      --line:rgba(51,212,255,.25);
      --glow:0 0 14px rgba(51,212,255,.45), 0 0 28px rgba(51,212,255,.25);
    }
    *{box-sizing:border-box}
    html, body{max-width:100%; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
    body{
      margin:0;
      touch-action:manipulation;
      font-family:"Space Grotesk", system-ui, -apple-system, sans-serif;
      color:var(--ink);
      background:radial-gradient(1000px 500px at 65% -10%, rgba(51,212,255,.18) 0%, rgba(5,7,10,1) 55%),
                 radial-gradient(900px 520px at 15% 0%, rgba(255,255,255,.06) 0%, rgba(5,7,10,1) 60%);
      line-height:1.6;
    }
    a.btn-cta{
      color:var(--ink);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 18px;
      border-radius:999px;
      border:1.5px solid var(--accent);
      box-shadow:var(--glow), inset 0 0 10px rgba(255,255,255,.12);
      background:linear-gradient(90deg, rgba(7,12,18,.65), rgba(14,60,75,.55));
      text-shadow:0 0 10px rgba(255,255,255,.65);
      font-weight:600;
      letter-spacing:.01em;
      transition: all .2s ease;
    }
    a.btn-cta:hover{
      box-shadow:0 0 18px rgba(51,212,255,.7), 0 0 40px rgba(51,212,255,.35), inset 0 0 16px rgba(255,255,255,.25);
      transform:translateY(-1px);
    }
    .wrap{max-width:980px; margin:0 auto; padding:48px 24px 80px}
    header{display:flex; flex-direction:column; gap:16px; padding:24px 0 8px; border-bottom:1px solid var(--line)}
    .eyebrow{letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; color:var(--muted)}
    h1{font-family:"Playfair Display", serif; font-size:clamp(2.1rem, 4vw, 3.2rem); line-height:1.05; margin:0}
    .tagline{font-size:clamp(1.1rem, 1.4vw, 1.4rem); color:var(--muted); max-width:70ch}
    
    section{padding:32px 0; border-bottom:1px solid var(--line)}
    h2{font-size:1.1rem; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); margin:0 0 18px}
    
    .grid-box { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-bottom: 10px; }
    .item-card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    .item-card strong { color: var(--accent); display: block; margin-bottom: 8px; font-size: 1.1rem; }

    .projects{display:grid; gap:20px}
    .card{
      background:rgba(8,12,18,.82);
      border:1px solid rgba(51,212,255,.35);
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 26px rgba(51,212,255,.18);
      display:flex;
      flex-direction:column;
      gap:12px;
      backdrop-filter:blur(6px);
    }
    .media-grid{ display:flex; flex-direction:column; gap:10px; align-items:center; margin:12px 0; }
    .media-grid img{
      width:auto;
      max-width:min(100%, 640px);
      height:auto;
      margin:0 auto;
      display:block;
      border:1px solid rgba(51,212,255,.25);
      border-radius:12px;
      background:#06080c;
    }
    .media-grid img.contain{ object-fit:contain; background:transparent; }

    .card h3{ font-family:"Playfair Display", serif; font-size:1.6rem; margin:0 0 4px; }
    .kicker{ color: var(--accent); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta{color:var(--muted); font-size:.95rem}
    .divider{height:1px; background:var(--line); margin:14px 0}
    .badges{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 8px}
    .badge{font-size:.78rem; padding:4px 10px; border-radius:999px; background:rgba(51,212,255,.15); color:#e9f8ff; border:1px solid rgba(51,212,255,.6);}

    .lang-switcher { 
      display: flex; 
      gap: 4px; 
      background: rgba(7,12,18,.45);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      width: fit-content;
      margin-bottom: 12px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 800;
      width: 40px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 999px;
      transition: all .24s ease;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #000;
    }

    .visitor-counter {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      background: rgba(51, 212, 255, 0.05);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 999px;
      width: fit-content;
      opacity: 0.8;
      z-index: 10;
    }

  <script>
    let currentLang = 'es';
    let translations = {};

    function init() {
      translations = JSON.parse(document.getElementById('translations-data').textContent);
      
      const userLang = 'es'; // Forzamos español por defecto
      setLanguage(userLang);
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      const btn = document.getElementById('btn-' + lang);
      if (btn) btn.classList.add('active');

      const data = translations[lang];
      
      const t = (path) => path.split('.').reduce((obj, key) => {
        const match = key.match(/(.+)\[(\d+)\]/);
        if (match) return obj[match[1]][match[2]];
        return obj && obj[key];
      }, data);

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val) el.innerHTML = val;
      });

      document.title = t('title');
      
      renderContent(lang);
    }

    function renderContent(lang) {
      const data = translations[lang].slides;

      // Section Titles
      document.getElementById('trayectoria-title').innerText = lang === 'es' ? 'Proyectos Seleccionados' : 'Selected Projects';

      // Engineering Grid
      const engGrid = document.getElementById('overview-grid');
      engGrid.innerHTML = data[0].stats.map(s => `
        <div class="item-card">
          <strong>${s.val || ''}</strong>
          <p class="meta">${s.full || s.label}</p>
        </div>
      `).join('');

      // Projects List
      const projectsList = document.getElementById('projects-list');
      projectsList.innerHTML = data.slice(1, 8).map(p => `
        <article class="card">
          <div class="kicker">${p.kicker}</div>
          <h3>${p.h2}</h3>
          <p class="meta">${p.lede}</p>
          <div class="badges">
            ${p.badges.map(b => `<span class="badge">${b}</span>`).join('')}
          </div>
          <div class="divider"></div>
          <p>${p.quote}</p>
          <div class="media-grid">
            <img src="assets/${p.id}.png" alt="${p.title}">
          </div>
          ${p.btn_url ? `<a class="btn-cta" href="${p.btn_url}" target="_blank" rel="noopener">${p.btn_text || 'Ver más'} →</a>` : ''}
        </article>
      `).join('');

      // Certs List
      const certsList = document.getElementById('certs-list');
      certsList.innerHTML = data[8].certs.map(c => `
        <div class="item-card">
          <strong>${c.title}</strong>
          <p class="meta">${c.body}</p>
        </div>
      `).join('');
    }

    async function updateCounter() {
      try {
        const response = await fetch('counter.php');
        if (response.ok) {
          const count = await response.text();
          document.getElementById('hit-count').innerText = count;
        }
      } catch (err) {
        console.error('Counter error:', err);
      }
    }

    init();
    updateCounter();
  </script>
</body>
</html>
