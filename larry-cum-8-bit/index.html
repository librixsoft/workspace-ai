const ctx = canvas.getContext('2d');

let GAME_H = window.innerHeight;

canvas.height = GAME_H;

const container = document.getElementById('gameContainer');

function resizeCanvas() {
  GAME_W = window.innerWidth;

      player.speed = player.baseSpeed;

    player.x = Math.max(0, Math.min(GAME_W - player.w, player.x));
    player.y = GAME_H - 150;

  if (typeof gameState !== 'undefined' && gameState === 'playing') {
    initBgStars();
    initSideElements();

}

const hudScore = document.getElementById('hudScore');

const startScreen = document.getElementById('startScreen');

if (isMobile) { mobileControls.style.display = 'flex'; }

const PIXEL = 4;
function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

function drawPixelCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(Math.floor(cx), Math.floor(cy), r, 0, Math.PI * 2);
  ctx.fill();
}

  { name: 'syringe', color: '#39ff14', accentColor: '#00aa00', w: 14, h: 48, speed: 2.8, points: 15, draw: drawSyringe },

];

const POWERUP_TYPES = [
  { name: 'shield', color: '#00ccff', duration: 300, draw: drawShieldPowerup },

];

let gameState = 'start';
let score = 0;
let lives = 3;
let level = 1;
let player = null;
let obstacles = [];
let powerups = [];
let playerBullets = [];
let particles = [];
let bgStars = [];
let sideElements = [];
let shakeTimer = 0;
let shakeIntensity = 0;
let lastShotTime = 0;
const SHOT_COOLDOWN = 250;
let spawnTimer = 0;
let spawnRate = 90;
let bgOffset = 0;
let powerupTimer = 0;
let activePowerup = null;
let powerupEndTime = 0;
let levelProgress = 0;
let levelTarget = 1000;
let flashTimer = 0;
let flashColor = '';

function initBgStars() {
  bgStars = [];
  const count = Math.max(60, Math.floor((GAME_W * GAME_H) / 4500));
  for (let i = 0; i < count; i++) {
    bgStars.push({
      x: Math.random() * GAME_W,
      y: Math.random() * GAME_H,
      size: Math.random() * 2 + 1,
      speed: (Math.random() * 0.5 + 0.3) * Math.max(1, GAME_H / 720),
      brightness: Math.random() * 0.5 + 0.5
    });
  }
}

function resetPlayer() {
  const pSpeed = Math.max(5, Math.min(10, GAME_W / 140));
  player = {
    x: GAME_W / 2 - 20,
    y: GAME_H - 150,
    w: 40,
    h: 44,
    speed: pSpeed,
    baseSpeed: pSpeed,
    moveLeft: false,
    moveRight: false,
    invincible: 0,
    tailPhase: 0
  };
}

function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  levelTarget = 1000;
  levelProgress = 0;
  resetPlayer();
  obstacles = [];
  powerups = [];
  playerBullets = [];
  particles = [];
  activePowerup = null;
  spawnRate = 80;
  spawnTimer = 0;
  powerupTimer = 0;
  flashTimer = 0;
  sideElements = [];

  initSideElements();
  gameState = 'playing';
  startScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  winScreen.style.display = 'none';
  hud.style.display = 'flex';

}

function nextLevel() {
  level++;
  levelTarget = 1000 + (level - 1) * 500;
  levelProgress = 0;
  spawnRate = Math.max(20, 80 - (level - 1) * 8);
  obstacles = [];
  powerups = [];
  playerBullets = [];
  resetPlayer();
  activePowerup = null;
  powerupTimer = 0;
  gameState = 'playing';
  winScreen.style.display = 'none';
  hud.style.display = 'flex';
  updateHud();
}

function updateHud() {
  hudScore.textContent = 'SCORE: ' + score;
  hudLevel.textContent = 'LEVEL: ' + level;
  hudLives.textContent = 'LIVES: ' + lives;
}

function drawCondom(x, y, w, h) {
  const s = PIXEL;
  drawPixelRect(x + 2, y, w - 4, h, '#d0d0ff');
  drawPixelRect(x + 2, y + h - 3, w - 4, 3, '#6666aa');
  for (let i = x + 6; i < x + w - 6; i += 8) {
    drawPixelRect(i, y + 2, 4, h - 4, '#8888cc');
  }
  drawPixelCircle(x + w / 2, y + h / 2, 3, '#ffffff');
}

  const s = PIXEL;
  drawPixelRect(x + 2, y, w - 4, h, '#22cc22');

  drawPixelRect(x + w / 2 - 1, y - 14, 2, 10, '#aaa');
  drawPixelRect(x + 2, y + 10, w - 4, h - 14, '#44ff44');
  drawPixelRect(x + 1, y + h - 4, w - 2, 4, '#11aa11');
}

  const halfW = Math.floor(w / 2);
  drawPixelRect(x, y, halfW, h, '#ff88aa');
  drawPixelRect(x + halfW, y, halfW, h, '#ffffff');
  drawPixelCircle(x + w / 2, y + h / 2, 3, '#ff4466');

  drawPixelRect(x + w / 2 - 3, y, 6, h, '#6666cc');

  drawPixelCircle(x + 4, y + 3, 3, '#8888ff');
  drawPixelCircle(x + w - 4, y + 3, 3, '#8888ff');
}

function drawDiaphragm(x, y, w, h) {
  for (let dx = 0; dx < w; dx += 4) {
    const wave = Math.sin(dx * 0.15) * 3;
    drawPixelRect(x + dx, y + wave, 4, h, '#ffaa44');
  }
  drawPixelRect(x + 4, y + 2, w - 8, h - 4, '#ff8822');
}

function drawFries(x, y, w, h) {
  const colors = ['#ffcc00', '#ff9900', '#ff6600'];
  for (let i = 0; i < 5; i++) {
    const fx = x + i * 7 + 1;
    drawPixelRect(fx, y, 5, h, colors[i % 3]);
    drawPixelRect(fx, y, 5, 4, '#ffee44');
  }
  drawPixelRect(x, y + h - 4, w, 4, '#cc4400');

function drawPenis(x, y, w, h, phase) {
  const shaftW = Math.floor(w * 0.45);

  const shaftColor = '#ff9988';

  const headR = Math.floor(w * 0.28);
  const headX = x + w / 2;
  const headY = y + headR;
  const ballR = Math.floor(w * 0.18);
  drawPixelRect(shaftX, y + headR, shaftW, h - headR, shaftColor);
  drawPixelRect(shaftX + 2, y + headR + 4, shaftW - 8, 2, veinColor);
  drawPixelRect(shaftX + 4, y + headR + 12, shaftW - 12, 2, veinColor);
  drawPixelCircle(headX, headY, headR, '#ff8877');
  drawPixelCircle(headX, headY, headR - 2, '#ffa090');
  const ballY = y + h - ballR;
  drawPixelCircle(x + w * 0.25, ballY, ballR, shaftColor);
  drawPixelCircle(x + w * 0.75, ballY, ballR, shaftColor);
  drawPixelCircle(x + w * 0.25 + 1, ballY + 1, ballR - 1, '#ffa090');
  drawPixelCircle(x + w * 0.75 + 1, ballY + 1, ballR - 1, '#ffa090');
  if (Math.sin(phase) > 0.5) {
    drawPixelCircle(headX + headR + 4, headY - 2, 2, '#ff4444');

  const lipColor = '#cc4466';
  const innerColor = '#882244';
  const darkColor = '#551133';

  const clitX = x + w / 2;
  const clitY = y + h * 0.18;
  const upperLabY = y + h * 0.25;
  const lowerLabY = y + h * 0.75;
  drawPixelRect(x + w * 0.15, upperLabY, w * 0.7, h * 0.55, innerColor);
  drawPixelRect(x + w * 0.25, upperLabY + 3, w * 0.5, h * 0.5, darkColor);
  drawPixelRect(x + w * 0.35, upperLabY + 6, w * 0.3, h * 0.45, '#441122');
  const wave1 = Math.sin(phase) * 2;
  const wave2 = Math.sin(phase + 1.5) * 2;
  drawPixelRect(x + Math.floor(wave1), upperLabY - 2, 4, h * 0.6, lipColor);
  drawPixelRect(x + w - Math.floor(wave1) - 4, upperLabY - 2, 4, h * 0.6, lipColor);
  drawPixelRect(x + Math.floor(wave2), lowerLabY + h * 0.5 - 2, 4, h * 0.3, lipColor);
  drawPixelRect(x + w - Math.floor(wave2) - 4, lowerLabY + h * 0.5 - 2, 4, h * 0.3, lipColor);
  drawPixelCircle(clitX, clitY, clitR, '#ee6688');

  sideElements = [];
  const types = ['penis', 'penis', 'penis', 'vagina', 'vagina', 'hands', 'drip', 'butt'];
  const leftCount = Math.floor((GAME_H / 65));

function drawLarry(x, y, w, h) {

  let pathY = tailStartY;

  drawPixelCircle(headX, headY, headR - 3, '#e8e8ff');
  drawPixelCircle(headX, headY, headR - 5, '#ffffff');
  const eyeLX = headX - 5;
  const eyeLY = headY - 3;
  const eyeRX = headX + 5;
  const eyeRY = headY - 3;
  drawPixelCircle(eyeLX, eyeLY, 4, '#ffffff');
  drawPixelCircle(eyeRX, eyeRY, 4, '#ffffff');
  const pupilOffX = Math.sin(phase) * 0.5;
  const pupilOffY = Math.cos(phase * 0.7) * 0.3;
  drawPixelCircle(eyeLX + pupilOffX - 1, eyeLY + pupilOffY, 2, '#222244');
  drawPixelCircle(eyeRX + pupilOffX + 1, eyeRY + pupilOffY, 2, '#222244');
  drawPixelCircle(eyeLX + pupilOffX - 1, eyeLY + pupilOffY - 1, 0.8, '#ffffff');
  drawPixelCircle(eyeRX + pupilOffX + 1, eyeRY + pupilOffY - 1, 0.8, '#ffffff');
  const mouthY = headY + 5;
  const mouthOpen = Math.sin(phase * 0.5) * 0.5 + 0.5;
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(headX, mouthY, 5 * mouthOpen + 2, 2 * mouthOpen + 1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#cc4444';
  ctx.beginPath();
  ctx.ellipse(headX, mouthY + 1, 3 * mouthOpen + 1, mouthOpen, 0, 0, Math.PI * 2);
  ctx.fill();
  const cheekR = 4;
  ctx.globalAlpha = 0.3;
  drawPixelCircle(headX - headR + 2, headY + 4, cheekR, '#ff8888');
  drawPixelCircle(headX + headR - 2, headY + 4, cheekR, '#ff8888');
  ctx.globalAlpha = 1;
  if (activePowerup && activePowerup.name === 'shield') {
    ctx.strokeStyle = 'rgba(0, 204, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(headX, headY, headR + 6 + Math.sin(Date.now() * 0.01) * 2, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShieldPowerup(x, y, size) {
  drawPixelCircle(x, y, size, '#00ccff');
  drawPixelCircle(x, y, size - 4, '#66eeff');
  ctx.fillStyle = '#ffffff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('S', x, y + 4);
}

function drawSpeedPowerup(x, y, size) {
  drawPixelCircle(x, y, size, '#ff6600');
  drawPixelCircle(x, y, size - 4, '#ff9944');
  ctx.fillStyle = '#ffffff';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('>>', x - 6, y + 4);
}

function drawMultiPowerup(x, y, size) {
  drawPixelCircle(x, y, size, '#ff00ff');
  drawPixelCircle(x, y, size - 4, '#ff66ff');
  ctx.fillStyle = '#ffffff';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('x3', x - 8, y + 4);
}

function drawOvule(x, y, size, phase) {
  const pulse = Math.sin(phase) * 3;
  ctx.globalAlpha = 0.15;
  drawPixelCircle(x, y, size + 10 + pulse, '#ffccdd');
  ctx.globalAlpha = 0.25;
  drawPixelCircle(x, y, size + 6, '#ffbbdd');
  ctx.globalAlpha = 1;
  drawPixelCircle(x, y, size, '#ffccdd');
  drawPixelCircle(x - 2, y - 2, size - 4, '#ffeedd');
  drawPixelCircle(x + 3, y + 3, size - 8, '#ffbbcc');
  const nucR = Math.max(2, size * 0.3);
  drawPixelCircle(x, y, nucR, '#ee6688');
  drawPixelCircle(x, y, nucR - 1, '#cc4466');
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2 + phase * 0.3;
    const px = x + Math.cos(ang) * (size * 0.6);
    const py = y + Math.sin(ang) * (size * 0.6);
    drawPixelCircle(px, py, 1.5, '#ff99aa');
  }
}

function spawnOvule() {
  const minX = 40;
  const maxX = Math.max(minX + 20, GAME_W - 80);
  powerups.push({
    x: minX + Math.random() * (maxX - minX),
    y: -20,
    size: 14,
    type: 'ovule',
    speed: 1.2 * Math.max(1, GAME_H / 720),
    pulse: 0
  });
}

function spawnObstacle() {
  const typeIdx = Math.min(
    Math.floor(Math.random() * Math.min(OBSTACLE_TYPES.length, 2 + level)),
    OBSTACLE_TYPES.length - 1
  );
  const type = OBSTACLE_TYPES[typeIdx];
  const speedMult = 1 + (level - 1) * 0.15;
  const speedScale = Math.max(1, GAME_H / 720);
  const minX = 40;
  const maxX = Math.max(minX + 20, GAME_W - type.w - 40);
  obstacles.push({
    x: minX + Math.random() * (maxX - minX),
    y: -type.h,
    w: type.w,
    h: type.h,
    type: type,
    speed: type.speed * speedMult * speedScale,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 0.05
  });
}

function spawnPowerup() {
  const typeIdx = Math.floor(Math.random() * POWERUP_TYPES.length);
  const type = POWERUP_TYPES[typeIdx];
  const minX = 40;
  const maxX = Math.max(minX + 20, GAME_W - 40);
  powerups.push({
    x: minX + Math.random() * (maxX - minX),
    y: -20,
    size: 12,
    type: type,
    speed: 1.5 * Math.max(1, GAME_H / 720),
    pulse: 0
  });
}

function addParticles(x, y, color, count, spread) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread + 1;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 20,
      maxLife: 30 + Math.random() * 20,
      color: color,
      size: Math.random() * 4 + 2
    });
  }
}

function addExplosion(x, y, color) {
  addParticles(x, y, color, 12, 3);
  addParticles(x, y, '#ffff88', 6, 2);
}

function checkCollision(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function usePowerup(pu) {
  const endTime = 300;
  if (pu.type.name === 'shield') {
    activePowerup = pu.type;
    player.invincible = endTime;
    addParticles(player.x + player.w / 2, player.y + player.h / 2, '#00ccff', 20, 4);
  } else if (pu.type.name === 'speed') {
    activePowerup = pu.type;
    player.speed = (player.baseSpeed || 5) * 1.6;
    player.invincible = endTime;
  } else if (pu.type.name === 'multi') {
    activePowerup = pu.type;
    playSound('multiActivate');
    score += Math.floor(score * 0.5);
    addParticles(player.x + player.w / 2, player.y, '#ff00ff', 15, 3);
  }
}

function update() {
  if (gameState !== 'playing') return;

  if (player.invincible > 0) player.invincible--;

  bgOffset += 0.5;

  player.tailPhase += 0.15;

  const spd = player.speed;
  if (player.moveLeft) player.x -= spd;
  if (player.moveRight) player.x += spd;
  player.x = Math.max(0, Math.min(GAME_W - player.w, player.x));

  for (let i = bgStars.length - 1; i >= 0; i--) {
    const star = bgStars[i];
    star.y += star.speed;
    if (star.y > GAME_H) {
      star.y = -2;
      star.x = Math.random() * GAME_W;
    }
  }

  spawnTimer += Math.max(1, GAME_W / 480);
  if (spawnTimer >= spawnRate) {
    spawnObstacle();
    spawnTimer = 0;
  }

  powerupTimer += Math.max(1, GAME_W / 480);
  if (powerupTimer >= 600) {
    spawnPowerup();
    powerupTimer = 0;
  }

  if (Math.random() < (0.003 + level * 0.001) * Math.max(1, GAME_W / 480)) {
    spawnOvule();
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.y += obs.speed;
    obs.rotation += obs.rotSpeed;
    if (obs.y > GAME_H + 60) {
      obstacles.splice(i, 1);
      levelProgress += 5;
      score += 5;
      continue;
    }
    if (player.invincible <= 0) {
      const hitMargin = 6;
      if (checkCollision(
        player.x + hitMargin, player.y + hitMargin,
        player.w - hitMargin * 2, player.h - hitMargin * 2,
        obs.x + 4, obs.y + 4,
        obs.w - 8, obs.h - 8
      )) {
        if (activePowerup && activePowerup.name === 'shield') {
          addExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, '#00ccff');
          obstacles.splice(i, 1);
          activePowerup = null;
          player.invincible = 0;
          continue;
        }
        lives--;
        playSound('playerHit');
        player.invincible = 120;
        addExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ff4444');
        shakeTimer = 15;
        shakeIntensity = 6;
        flashTimer = 10;
        flashColor = 'rgba(255,0,0,0.3)';
        obstacles.splice(i, 1);
        if (lives <= 0) {
          playSound('gameOver');
          gameState = 'gameover';
          hud.style.display = 'none';
          gameOverScreen.style.display = 'flex';
          finalScoreEl.textContent = 'Score: ' + score;
          continue;
        }
        updateHud();
      }
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const pu = powerups[i];
    pu.y += pu.speed;
    pu.pulse += 0.1;
    if (pu.y > GAME_H + 30) {
      powerups.splice(i, 1);
      continue;
    }
    if (checkCollision(
      player.x, player.y, player.w, player.h,
      pu.x - pu.size, pu.y - pu.size,
      pu.size * 2, pu.size * 2
    )) {
      if (pu.type === 'ovule') {
        lives++;
        playSound('ovule');
        addParticles(pu.x, pu.y, '#ffccdd', 15, 3);
        addParticles(pu.x, pu.y, '#ff8899', 8, 2);
        flashTimer = 8;
        flashColor = 'rgba(255,200,220,0.3)';
      } else {
        usePowerup(pu);
        playSound('powerup');
        addParticles(pu.x, pu.y, pu.type.color, 10, 3);
      }
      powerups.splice(i, 1);
      updateHud();
      continue;
    }
  }

  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= (b.speed || 8);
    if (b.y < -10) {
      playerBullets.splice(i, 1);
      continue;
    }
    for (let j = obstacles.length - 1; j >= 0; j--) {
      const obs = obstacles[j];
      if (checkCollision(b.x, b.y, 6, 12, obs.x, obs.y, obs.w, obs.h)) {
        addExplosion(obs.x + obs.w / 2, obs.y + obs.h / 2, '#ffaa00');
        playSound('hit');
        score += obs.type.points;
        levelProgress += obs.type.points;
        obstacles.splice(j, 1);
        playerBullets.splice(i, 1);
        updateHud();
        break;
      }
    }
  }

  if (shakeTimer > 0) shakeTimer--;
  if (flashTimer > 0) flashTimer--;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (levelProgress >= levelTarget) {
    gameState = 'win';
    playSound('levelWin');
    hud.style.display = 'none';
    winScreen.style.display = 'flex';
    winScoreEl.textContent = 'Score: ' + score;
  }

  updateHud();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, GAME_H);
  grad.addColorStop(0, '#0a0a2e');
  grad.addColorStop(1, '#1a0a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  if (bgStars.length === 0) initBgStars();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  bgStars.forEach(star => {
    const alpha = star.brightness * (0.5 + 0.5 * Math.sin(Date.now() * 0.003 + star.x));
    ctx.globalAlpha = alpha;
    drawPixelRect(star.x, star.y, star.size, star.size, '#ffffff');
  });
  ctx.globalAlpha = 1;

  if (sideElements.length === 0) initSideElements();
  sideElements.forEach(el => {
    el.phase += el.bobSpeed;
    const bobY = Math.sin(el.phase) * 3;
    el.y += bobY;
    if (el.y > GAME_H + 60) el.y = -60;
    if (el.y < -60) el.y = GAME_H + 60;
    const drawW = Math.floor(el.w * el.scale);
    const drawH = Math.floor(el.h * el.scale);
    if (el.type === 'penis') {
      drawPenis(el.x, el.y, drawW, drawH, el.phase);
    } else if (el.type === 'vagina') {
      drawVagina(el.x, el.y, drawW, drawH, el.phase);
    } else if (el.type === 'hands') {
      drawTwoHandsFucking(el.x, el.y, drawW, drawH, el.phase);
    } else if (el.type === 'drip') {
      drawSemenDrip(el.x, el.y, drawW, drawH, el.phase);
    } else if (el.type === 'butt') {
      drawButt(el.x, el.y, drawW, drawH, el.phase);
    }
  });
}

function drawTargetOvule() {
  const ovuleY = GAME_H - 50;
  const pulse = Math.sin(Date.now() * 0.005) * 3;
  ctx.fillStyle = 'rgba(255, 180, 200, 0.3)';
  ctx.beginPath();
  ctx.arc(GAME_W / 2, ovuleY, 40 + pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffbbcc';
  ctx.beginPath();
  ctx.arc(GAME_W / 2, ovuleY, 30 + pulse * 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff8899';
  ctx.beginPath();
  ctx.arc(GAME_W / 2, ovuleY, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#cc4466';
  ctx.beginPath();
  ctx.arc(GAME_W / 2, ovuleY, 6, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.save();

  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }

  drawBackground();

  if (gameState === 'playing' || gameState === 'win') {
    drawTargetOvule();

    powerups.forEach(pu => {
      const glow = Math.sin(pu.pulse) * 3;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(pu.x, pu.y, pu.size + 6 + glow, 0, Math.PI * 2);
      ctx.fill();
      if (pu.type === 'ovule') {
        drawOvule(pu.x, pu.y, pu.size, pu.pulse);
      } else {
        pu.type.draw(pu.x - pu.size, pu.y - pu.size, pu.size * 2, pu.size * 2);
      }
    });

    obstacles.forEach(obs => {
      ctx.save();
      ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2);
      ctx.rotate(obs.rotation);
      ctx.translate(-(obs.x + obs.w / 2), -(obs.y + obs.h / 2));
      obs.type.draw(obs.x, obs.y, obs.w, obs.h);
      ctx.restore();
    });

    playerBullets.forEach(b => {
      drawPixelRect(b.x + 1, b.y, 4, 12, '#00ccff');
      drawPixelRect(b.x + 2, b.y - 2, 2, 4, '#66eeff');
    });

    if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
      drawLarry(player.x, player.y, player.w, player.h);
    }

    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      drawPixelRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size, p.color);
    });
    ctx.globalAlpha = 1;

    if (flashTimer > 0) {
      ctx.fillStyle = flashColor;
      ctx.fillRect(0, 0, GAME_W, GAME_H);
    }

    ctx.fillStyle = 'rgba(57, 255, 20, 0.8)';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    const progBarW = Math.min(320, Math.floor(GAME_W * 0.5));
    const prog = Math.min(levelProgress / levelTarget, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(GAME_W / 2 - progBarW / 2, GAME_H - 30, progBarW, 12);
    if (prog > 0) {
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(GAME_W / 2 - progBarW / 2, GAME_H - 30, progBarW * prog, 12);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px monospace';
    ctx.fillText('LLEGADA AL OVULO', GAME_W / 2, GAME_H - 34);
  }

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function handleKeyDown(e) {
  if (!player) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.moveLeft = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.moveRight = true;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    shoot();
  }
}

function handleKeyUp(e) {
  if (!player) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') player.moveLeft = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') player.moveRight = false;
}

function shoot() {
  if (gameState !== 'playing' || !player) return;
  const now = Date.now();
  if (now - lastShotTime < SHOT_COOLDOWN) return;
  lastShotTime = now;
  playSound('shoot');
  const bulletSpeed = Math.max(9, Math.round(GAME_H / 75));
  playerBullets.push({
    x: player.x + player.w / 2 - 3,
    y: player.y,
    speed: bulletSpeed
  });
  if (activePowerup && activePowerup.name === 'multi') {
    playerBullets.push({
      x: player.x + player.w / 2 - 18,
      y: player.y,
      speed: bulletSpeed
    });
    playerBullets.push({
      x: player.x + player.w / 2 + 12,
      y: player.y,
      speed: bulletSpeed
    });
  }
}

function resetActivePowerup() {
  activePowerup = null;
  if (player) player.speed = player.baseSpeed || 5;
  if (player) player.invincible = 0;
}

document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

startBtn.addEventListener('click', () => { playSound('start'); startGame(); });
restartBtn.addEventListener('click', () => { playSound('start'); startGame(); });
nextLevelBtn.addEventListener('click', () => {
  resetActivePowerup();
  playSound('start');
  nextLevel();
});

btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); if (player) player.moveLeft = true; });
btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); if (player) player.moveLeft = false; });
btnLeft.addEventListener('mousedown', () => { if (player) player.moveLeft = true; });
btnLeft.addEventListener('mouseup', () => { if (player) player.moveLeft = false; });
btnLeft.addEventListener('mouseleave', () => { if (player) player.moveLeft = false; });

btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); if (player) player.moveRight = true; });
btnRight.addEventListener('touchend', (e) => { e.preventDefault(); if (player) player.moveRight = false; });
btnRight.addEventListener('mousedown', () => { if (player) player.moveRight = true; });
btnRight.addEventListener('mouseup', () => { if (player) player.moveRight = false; });
btnRight.addEventListener('mouseleave', () => { if (player) player.moveRight = false; });

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
canvas.addEventListener('click', () => { shoot(); });

startScreen.style.display = 'flex';
gameLoop();
</script>
</body>
